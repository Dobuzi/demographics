<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>인구의 이동</title>
    <link rel="icon" href="data:," />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#14161a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,1,0"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preload" href="assets/geo/korea_sido.geojson" as="fetch" crossorigin />
    <link rel="preload" href="assets/geo/sido_office_centers.json" as="fetch" crossorigin />
    <script>
      window.KOSIS_USE_MERGED = true;
      window.KOSIS_DATA_BASE_URL =
        "https://raw.githubusercontent.com/Dobuzi/demographics-data/main";
    </script>
  </head>
  <body>
    <div class="page">

      <main class="content">
        <section class="map-shell map-shell--full">
          <div class="top-row">
            <div class="map-header glass-panel">
              <h1>인구의 이동</h1>
              <a
                class="kosis-tag"
                href="https://kosis.kr"
                target="_blank"
                rel="noopener noreferrer"
              >
                KOSIS 데이터 기반
              </a>
            </div>
            <div class="top-row__spacer" aria-hidden="true"></div>
            <div class="panel panel-summary glass-panel">
              <div class="stat-grid">
                <div class="stat stat--total">
                  <span class="stat__label" id="stat-total-label">총 이동 규모</span>
                  <span class="stat__value" id="stat-total">-</span>
                </div>
                <div class="stat">
                  <div class="age-control summary-age">
                    <input type="range" class="control-range" id="age-range" min="0" max="17" value="0" aria-label="연령대" />
                    <span class="age-value" id="age-value">전체 연령</span>
                  </div>
                </div>
                <div class="stat">
                  <div class="year-control">
                    <input type="range" class="control-range" id="year-range" min="1995" max="2025" value="2024" aria-label="연도" />
                    <span class="summary-year-label" id="year-label">2024</span>
                    <button type="button" class="play-toggle" id="play-toggle" aria-label="재생">
                      <span class="material-symbols-rounded">play_arrow</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="map-stage">
            <div class="map-card">
            <div class="map-wrap">
              <svg
                id="flow-map"
                viewBox="-40 0 980 780"
                preserveAspectRatio="xMidYMid meet"
                role="img"
                aria-label="인구 이동 지도"
              ></svg>
              <div class="map-overlay" id="flow-overlay"></div>
              <div class="flow-tooltip" id="flow-tooltip" role="status"></div>
              <div class="zoom-controls glass-panel" role="group" aria-label="지도 확대/축소">
                <button type="button" class="zoom-btn" id="zoom-in" aria-label="확대">
                  <span class="material-symbols-rounded">add</span>
                </button>
                <button type="button" class="zoom-btn" id="zoom-out" aria-label="축소">
                  <span class="material-symbols-rounded">remove</span>
                </button>
                <button type="button" class="zoom-btn" id="zoom-reset" aria-label="원래 크기">
                  <span class="material-symbols-rounded">fit_screen</span>
                </button>
              </div>
              <div class="error-banner" id="error-banner" role="alert" aria-live="assertive">
                <span class="error-banner__message" id="error-message"></span>
                <button type="button" class="error-banner__retry" id="error-retry" aria-label="다시 시도">다시 시도</button>
              </div>
              <div class="map-tags">
                <div class="map-tag-row map-tag-row--bottom">
                  <div class="net-legend" id="net-legend"></div>
                  <div class="map-tag-right">
                    <span class="play-loading" id="play-loading" aria-hidden="true"></span>
                    <span class="map-card__badge" id="badge-period">-</span>
                  </div>
                </div>
              </div>
              <div class="overlay-flows">
                <div class="top-flows-title" id="sidebar-title">TOP3</div>
                <section class="panel panel-flows glass-panel">
                  <ol id="top-flows-list" class="top-flows-list"></ol>
                </section>
              </div>
            </div>
          </div>

          <div class="overlay-settings">
            <button
              type="button"
              class="settings-toggle glass-panel"
              id="settings-toggle"
              aria-label="설정 열기"
            >
              <span class="material-symbols-rounded">settings</span>
            </button>
            <section class="panel panel-settings glass-panel is-collapsed" id="settings-panel">
              <div class="panel__header">
                <h2>설정</h2>
              </div>
              <div class="controls is-compact">
                <label class="field field-sex">
                  성별
                  <select id="sex-select">
                    <option value="0">전체</option>
                    <option value="1">남자</option>
                    <option value="2">여자</option>
                  </select>
                </label>
                <label class="field field-item">
                  지표
                  <div class="select-with-info">
                    <select id="item-select">
                      <option value="T70">이동자수</option>
                      <option value="T80" selected>순이동자수</option>
                    </select>
                    <button type="button" class="info-chip" id="indicator-info" aria-label="지표 설명">
                      i
                    </button>
                    <div class="info-tooltip" id="indicator-tooltip" role="status"></div>
                  </div>
                </label>
                <label class="field field-speed">
                  재생 속도
                  <div class="play-speed">
                    <input type="range" id="play-speed" min="0.5" max="2" step="0.1" value="1" aria-label="재생 속도" />
                    <span class="summary-year-label" id="play-speed-label">1.0x</span>
                  </div>
                </label>
              </div>
              <div class="panel__footer">
                <label class="field field-lang">
                  Language
                  <select id="lang-switch" aria-label="Language">
                    <option value="ko">한국어</option>
                    <option value="en">English</option>
                  </select>
                </label>
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="테마 전환">
                  <span class="material-symbols-rounded" id="theme-icon">dark_mode</span>
                </button>
              </div>
            </section>
          </div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <p>
          <a href="https://github.com/Dobuzi/demographics" target="_blank" rel="noopener noreferrer">
            © 2026 Made by Dobuzi
          </a>
        </p>
      </footer>
    </div>

    <script src="geo/region_mapping.js"></script>
    <script src="geo/flow_style.js"></script>
    <script src="geo/geo_utils.js"></script>
    <script src="geo/data_utils.js"></script>
    <script src="geo/data_processing.js"></script>
    <script src="geo/i18n.js"></script>
    <script src="geo/canvas_renderer.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(function (err) {
          console.warn("[sw] registration failed", err);
        });
      }
    </script>
  </body>
</html>
